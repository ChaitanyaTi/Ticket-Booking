services:
  - type: web
    name: ticket-booking-backend
    env: node
    plan: free
    region: ohio # Default US region
    rootDir: backend
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run prisma:push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: HOLD_TTL_MINUTES
        value: "10"
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: "15"
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
